# Shared by the http and https configs.

client_max_body_size 1m;

# API -> Spring Boot. Same domain as the site, so the browser never makes a cross-origin call.
location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Vite puts a content hash in every built filename, so these can be cached for a year.
# ("expires" rather than add_header: an add_header here would silently drop the
# server-level security headers - nginx doesn't merge them.)
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# Everything else is the React app. /dashboard, /store, /scanner only exist in JavaScript,
# so unknown paths fall back to index.html (otherwise refreshing a page gives a 404).
# index.html itself is never cached, so a redeploy shows up immediately.
location / {
    expires -1;
    try_files $uri /index.html;
}
